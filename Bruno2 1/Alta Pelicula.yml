info:
  name: Alta Pelicula
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/ActividadFinal/SvPeliculaCrear
  body:
    type: form-urlencoded
    data:
      - name: titulo
        value: Primate
      - name: genero
        value: Terror
      - name: anio
        value: "2025"
      - name: duracion
        value: "1.29"
      - name: director
        value: Johannes Roberts
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
